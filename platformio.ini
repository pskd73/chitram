; PlatformIO Project Configuration File

[common]
lib_deps =
  adafruit/Adafruit ILI9341
  adafruit/Adafruit GFX Library
  gilmaimon/ArduinoWebsockets @ ^0.5.4
  bodmer/TJpg_Decoder @ ^1.0.8
  bitbank2/PNGdec @ ^1.0.1
  bitbank2/JPEGENC @ ^1.1.0
; UI shell + AP server live outside src/
build_flags =
  -I${PROJECT_DIR}/shell
  -I${PROJECT_DIR}/ap_server
  -I${PROJECT_DIR}/ap_server/core
build_src_filter =
  +<*>
  +<../shell/>
  +<../ap_server/>
  -<../ap_server/ui/>

; ---- Original ESP32 DevKit (LCD + mic product firmware) ----
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = littlefs

build_flags =
  ${common.build_flags}
  -DCORE_DEBUG_LEVEL=0

build_src_filter =
  ${common.build_src_filter}

extra_scripts =
  pre:patch_ws_insecure.py
  pre:build_ap_css.py

lib_deps =
  ${common.lib_deps}

; ---- OceanLabz / Freenove-style ESP32-S3-WROOM N16R8 CAM ----
; SD_MMC fixed pins: CMD=38 CLK=39 D0=40
[env:esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem5C390052181
monitor_port = /dev/cu.usbmodem5C390052181

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
  ${common.build_flags}
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  ; CDC on boot fights USB-Serial/JTAG app RX — use JTAG driver in input.cpp instead
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCHITRAM_BOARD_S3=1

build_src_filter =
  ${common.build_src_filter}

extra_scripts =
  pre:patch_ws_insecure.py
  pre:build_ap_css.py

lib_deps =
  ${common.lib_deps}
